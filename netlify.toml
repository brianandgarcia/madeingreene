[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.18.0"

# Retired pages. `force` is required because a static fallback page exists at each path.
[[redirects]]
  from = "/estimate"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/find-your-fit"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/quote"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/vs-godaddy"
  to = "/why-not-other-providers"
  status = 301
  force = true

# The farm-stand offer page was retired; send old links to the packages on the homepage.
[[redirects]]
  from = "/farm-stands"
  to = "/"
  status = 301

# Nov 2026 redesign: small-business packages moved to the homepage, and
# Services became a nav dropdown (Custom Websites, Integrations).
[[redirects]]
  from = "/small-business"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/custom-websites"
  status = 301
  force = true
